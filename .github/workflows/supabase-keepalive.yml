# Keeps the free Supabase project ("Nexa Management") from auto-pausing.
# Free projects pause after ~7 days with no activity, which would take the
# client portal (nexaone.org/portal) and the Workspace app offline.
# Every 3 days this makes one tiny read. Security rules return no rows to an
# anonymous caller, so no data is exposed; it only registers activity.
# The key below is the public "publishable" key that already ships in the
# portal page, so it's safe here.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 15 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -fsS --retry 3 --retry-delay 20             "https://gmjwlvcpowiirmufatjs.supabase.co/rest/v1/projects?select=id&limit=1"             -H "apikey: sb_publishable_WT0bouWuc5u-cHPifsF5sA__lG9xIX5"
          echo
          echo "Supabase pinged OK"
